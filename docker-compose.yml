services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nessie:
    image: ghcr.io/projectnessie/nessie:0.104.4
    ports:
      - "19120:19120"
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/dagster"
      QUARKUS_DATASOURCE_USERNAME: dagster
      QUARKUS_DATASOURCE_PASSWORD: dagster
      # Iceberg REST Catalog wiring (Nessie >= 0.91)
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: warehouse
      NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION: "s3://raw-flights/warehouse"
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: us-east-1
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: "http://seaweedfs-s3:8333"
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_EXTERNAL_ENDPOINT: ${NESSIE_S3_EXTERNAL_ENDPOINT:-http://seaweedfs-s3:8333}
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: "true"
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_AUTH_TYPE: STATIC
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ACCESS_KEY: "urn:nessie-secret:quarkus:nessie.catalog.secrets.s3"
      NESSIE_CATALOG_SECRETS_S3_NAME: ${SEAWEEDFS_ACCESS_KEY:-admin}
      NESSIE_CATALOG_SECRETS_S3_SECRET: ${SEAWEEDFS_SECRET_KEY:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/19120; printf 'GET /api/v1/config HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.68
    command: master -ip=seaweedfs-master -port=9333
    ports:
      - "9333:9333"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9333 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.68
    command: volume -mserver=seaweedfs-master:9333 -port=8080
    ports:
      - "8080:8080"
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.68
    command: filer -master=seaweedfs-master:9333 -port=8888
    ports:
      - "8888:8888"
    depends_on:
      - seaweedfs-volume

  seaweedfs-s3:
    image: chrislusf/seaweedfs:3.68
    command: s3 -filer=seaweedfs-filer:8888 -port=8333 -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    depends_on:
      - seaweedfs-filer

  dagster-webserver:
    profiles: ["app"]
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    command: dagster-webserver -h 0.0.0.0 -p 3000
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/app
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgres
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      NESSIE_ENDPOINT: http://nessie:19120/iceberg/
      AIRPORT_ICAO: KJFK
      INGEST_START_DATE: "2024-01-01"
      INGEST_END_DATE: "2024-12-31"
    depends_on:
      postgres:
        condition: service_healthy
      nessie:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
    volumes:
      - ./pipeline:/opt/dagster/app

  dagster-daemon:
    profiles: ["app"]
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    command: dagster-daemon run
    environment:
      DAGSTER_HOME: /opt/dagster/app
      DAGSTER_POSTGRES_USER: dagster
      DAGSTER_POSTGRES_PASSWORD: dagster
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: postgres
      SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
      NESSIE_ENDPOINT: http://nessie:19120/iceberg/
      AIRPORT_ICAO: KJFK
      INGEST_START_DATE: "2024-01-01"
      INGEST_END_DATE: "2024-12-31"
    depends_on:
      postgres:
        condition: service_healthy
      nessie:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
    volumes:
      - ./pipeline:/opt/dagster/app

volumes:
  postgres_data:
