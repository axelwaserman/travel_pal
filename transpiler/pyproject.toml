[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel_pal_transpiler"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["sqlglot>=25"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
