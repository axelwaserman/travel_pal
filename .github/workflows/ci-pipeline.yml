name: ci-pipeline

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ci-pipeline.yml"
  push:
    branches: [master]
    paths:
      - "pipeline/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ci-pipeline.yml"

concurrency:
  group: ci-pipeline-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.13"
  UV_PYTHON: "3.13"
  UV_SYSTEM_PYTHON: "1"

jobs:
  lint:
    name: ruff lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install ruff
        run: uv tool install ruff
      - name: ruff check
        run: ruff check pipeline
      - name: ruff format check
        run: ruff format --check pipeline

  typecheck:
    name: ty type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install pipeline
        run: |
          uv pip install --system -e ./pipeline[dev]
      - name: ty check pipeline
        working-directory: pipeline
        # Point ty at the system Python where `uv pip install --system` placed
        # the project + deps. Without this, uvx ty inspects its own isolated env.
        run: uvx ty check . --python "$pythonLocation"

  test:
    name: pytest unit + integration with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install pipeline (with dev extras)
        run: uv pip install --system -e ./pipeline[dev]
      - name: pytest unit + integration with coverage
        working-directory: pipeline
        run: pytest tests -v --tb=short --cov=pipeline --cov-report=term-missing --cov-fail-under=80
