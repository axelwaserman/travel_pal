name: ci-e2e

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.13"
  UV_SYSTEM_PYTHON: "1"

jobs:
  e2e:
    name: docker stack + playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install pipeline
        run: uv pip install --system -e ./pipeline[dev]

      - name: write .env
        run: cp .env.example .env

      - name: docker compose up infra
        run: |
          docker compose up -d postgres nessie seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3

      - name: wait for infra healthy
        run: |
          for i in {1..40}; do
            if docker compose ps --format json postgres | grep -q '"Health":"healthy"' \
              && docker compose ps --format json nessie | grep -q '"Health":"healthy"'; then
              echo "infra healthy"
              exit 0
            fi
            echo "waiting... ($i)"
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: configure seaweedfs buckets
        run: |
          docker compose exec -T seaweedfs-master sh -c "$(cat scripts/seaweedfs/init.sh)"

      - name: materialize dagster assets (smoke)
        env:
          SEAWEEDFS_S3_ENDPOINT: http://localhost:8333
          SEAWEEDFS_ACCESS_KEY: admin
          SEAWEEDFS_SECRET_KEY: admin
          NESSIE_ENDPOINT: http://localhost:19120/api/v1
          AIRPORT_ICAO: KJFK
          # Dates match the firstSeen timestamps in the fixture files so the
          # stub adapter returns real records without hitting the OpenSky API.
          INGEST_START_DATE: "2024-01-01"
          INGEST_END_DATE: "2024-01-02"
          # Fixture mode: adapter reads JSON files instead of making HTTP requests.
          OPENSKY_FIXTURE_DIR: tests/fixtures
        working-directory: pipeline
        run: dagster asset materialize --select '*' -m pipeline

      - name: assert non-zero rows in raw_flights iceberg table
        env:
          NESSIE_ENDPOINT: http://localhost:19120/api/v1
          SEAWEEDFS_S3_ENDPOINT: http://localhost:8333
          SEAWEEDFS_ACCESS_KEY: admin
          SEAWEEDFS_SECRET_KEY: admin
        run: |
          python -c "
          import os
          from pyiceberg.catalog.rest import RestCatalog

          catalog = RestCatalog(
              name='nessie',
              **{
                  'uri': os.environ['NESSIE_ENDPOINT'],
                  's3.endpoint': os.environ['SEAWEEDFS_S3_ENDPOINT'],
                  's3.access-key-id': os.environ['SEAWEEDFS_ACCESS_KEY'],
                  's3.secret-access-key': os.environ['SEAWEEDFS_SECRET_KEY'],
                  'prefix': 'main',
              }
          )
          table = catalog.load_table('flights.raw_flights')
          arrow_table = table.scan().to_arrow()
          rows = arrow_table.num_rows
          print(f'raw_flights row count: {rows}')
          assert rows > 0, f'Expected >0 rows in raw_flights, got {rows}'
          print('Assertion passed: raw_flights has non-zero rows.')
          "

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      - name: build frontend
        working-directory: frontend
        run: npm run build

      - name: install playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: run playwright smoke
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        run: npm run test:e2e

      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: tear down
        if: always()
        run: docker compose down -v
