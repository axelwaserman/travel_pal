name: ci-e2e

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.13"
  UV_SYSTEM_PYTHON: "1"

jobs:
  e2e:
    name: docker stack + playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install pipeline
        run: uv pip install --system -e ./pipeline[dev]

      - name: write .env
        run: cp .env.example .env

      - name: docker compose up infra
        run: |
          docker compose up -d postgres nessie seaweedfs-master seaweedfs-volume seaweedfs-filer seaweedfs-s3

      - name: wait for infra healthy
        run: |
          for i in {1..40}; do
            if docker compose ps --format json postgres | grep -q '"Health":"healthy"' \
              && docker compose ps --format json nessie | grep -q '"Health":"healthy"'; then
              echo "infra healthy"
              exit 0
            fi
            echo "waiting... ($i)"
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: configure seaweedfs buckets
        run: |
          docker compose exec -T seaweedfs-master sh -c '
            echo "s3.bucket.create -name raw-flights" | weed shell -master=localhost:9333
            echo "s3.bucket.create -name frontend-exports" | weed shell -master=localhost:9333
            echo "s3.configure -user=admin -access_key=admin -secret_key=admin -actions=Read,Write,List,Tagging,Admin -apply" | weed shell -master=localhost:9333
            echo "s3.configure -user=anonymous -buckets=frontend-exports -actions=Read,List -apply" | weed shell -master=localhost:9333
          '

      - name: materialize dagster assets (smoke)
        env:
          SEAWEEDFS_S3_ENDPOINT: http://localhost:8333
          SEAWEEDFS_ACCESS_KEY: admin
          SEAWEEDFS_SECRET_KEY: admin
          NESSIE_ENDPOINT: http://localhost:19120/api/v1
          AIRPORT_ICAO: KJFK
          # Future dates guarantee zero rows from the OpenSky historical endpoint,
          # exercising the empty-row guards added in Task 8 without requiring live creds.
          INGEST_START_DATE: "2030-01-01"
          INGEST_END_DATE: "2030-01-02"
        working-directory: pipeline
        run: dagster asset materialize --select '*' -m pipeline

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      - name: build frontend
        working-directory: frontend
        run: npm run build

      - name: install playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: run playwright smoke
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        run: npm run test:e2e

      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: tear down
        if: always()
        run: docker compose down -v
