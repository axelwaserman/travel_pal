travel_pal:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '/tmp/travel_pal.duckdb') }}"
      extensions:
        - httpfs
        - iceberg
      # S3 credentials are also configured via macros/setup_iceberg.sql
      # (CREATE SECRET) for iceberg_scan() resolution. Keep both in sync.
      settings:
        s3_endpoint: "{{ env_var('SEAWEEDFS_S3_ENDPOINT', 'localhost:8333') | replace('http://', '') | replace('https://', '') }}"
        s3_access_key_id: "{{ env_var('SEAWEEDFS_ACCESS_KEY', 'admin') }}"
        s3_secret_access_key: "{{ env_var('SEAWEEDFS_SECRET_KEY', 'admin') }}"
        s3_use_ssl: false
        s3_url_style: path
        # Allow iceberg_scan() to glob S3 for the latest snapshot when no
        # version-hint.text is present (Nessie-managed tables don't write one).
        unsafe_enable_version_guessing: true
